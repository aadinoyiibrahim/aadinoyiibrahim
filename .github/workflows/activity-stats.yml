name: Update activity overview

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Build figure
        env:
          # STATS_TOKEN (your personal token) also counts private contributions;
          # falls back to the built-in token (public contributions only).
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/activity_stats.py --login ${{ github.repository_owner }} --outdir figs/ --top 8

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figs/activity_overview.png
          git diff --cached --quiet || git commit -m "Update activity overview"
          git push
